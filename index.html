function matchJob(text) {

  for (const [k, j] of Object.entries(JOBS)) if (j.label.toLowerCase() === t) return k;
  let best = null, bestLen = 0;

  return best;

/* For job titles we don't know: a neutral profile adjusted by keywords in the title. */
function inferSkills(text) {
  const t = (text || '').toLowerCase();
  const s = { communication: 3, writing: 2, listening: 3, critical: 3, problem: 3, timeMgmt: 3, organization: 3, customer: 2, numeracy: 2, spreadsheets: 2, detail: 3, teaching: 1, persuasion: 2, techFluency: 2, visual: 1, coding: 0, research: 2 };
  const bump = (keys, kw, lvl) => { if (kw.some(w => t.includes(w))) keys.forEach(k => s[k] = Math.max(s[k], lvl)); };
  bump(['spreadsheets', 'numeracy', 'detail'], ['analyst', 'finance', 'excel', 'data', 'clerk'], 4);
  bump(['writing', 'research'], ['writer', 'editor', 'journalist', 'content', 'paralegal'], 4);
  bump(['customer', 'listening'], ['service', 'client', 'support', 'patient'], 4);
  bump(['organization', 'timeMgmt'], ['coordinator', 'manager', 'scheduler', 'dispatcher', 'planner'], 4);
  bump(['visual'], ['design', 'artist', 'photograph'], 4);
  bump(['coding', 'techFluency'], ['developer', 'it ', 'technician', 'engineer'], 3);
  bump(['teaching'], ['coach', 'trainer', 'counselor'], 4);
  return s;
}

function profileSkills(profile) {
  if (profile.jobKey && JOBS[profile.jobKey]) return JOBS[profile.jobKey].s;
  return profile.inferred || inferSkills(profile.jobLabel);
}

/* Transferable-skill match: weighted share of the target role's required skill levels you already cover.
   Weight = required level, x1.8 for hard (tool/technical) skills so soft skills alone cannot inflate the score. */
const HARD = new Set(['coding', 'spreadsheets', 'visual', 'techFluency', 'numeracy']);
function computeMatch(cur, req) {
  let have = 0, need = 0;
  const transferable = [], gaps = [], polish = [];
  for (const [k, r] of Object.entries(req)) {
    const c = cur[k] || 0;
    const wt = r * (HARD.has(k) ? 1.8 : 1); have += Math.min(c, r) * wt; need += r * wt;
    if (c >= 3 && r >= 2) transferable.push({ k, c, r });
    if (r - c >= 2) gaps.push({ k, c, r, gap: r - c });
    else if (r - c === 1) polish.push({ k, c, r });
  }
  transferable.sort((a, b) => Math.min(b.c, b.r) - Math.min(a.c, a.r) || b.r - a.r);
  gaps.sort((a, b) => b.gap - a.gap || b.r - a.r);
  return { score: Math.round((have / need) * 100), transferable, gaps, polish };
}

/* Seeded dataset for the Data Analyst week-2 task: answers are computed from the data, not stored. */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function makeCoffeeData(seed) {
  const rnd = mulberry32(seed);
  const names = ['Downtown', 'Airport', 'Campus', 'Riverside', 'Harbor'];
  const order = names.map(n => [n, rnd()]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
  const growths = [0.30 + rnd() * 0.12, 0.04 + rnd() * 0.05, 0.12 + rnd() * 0.06, -0.06 + rnd() * 0.04, 0.16 + rnd() * 0.06];
  const stores = order.map((n, i) => ({ n, base: 15000 + Math.round(rnd() * 12000), g: growths[i] }));
  const dipMonth = 1 + Math.floor(rnd() * 3); // Feb, Mar or Apr
  const season = MONTHS.map((_, m) => (m === dipMonth ? 0.74 : 1 + (m === 11 ? 0.1 : 0) + (rnd() - 0.5) * 0.04));
  const prodNames = [['Latte', 'Cold Brew', 'Pastries'], ['Cold Brew', 'Latte', 'Pastries'], ['Pastries', 'Latte', 'Cold Brew']][Math.floor(rnd() * 3)];
  const shares = [0.45, 0.31, 0.24];
  const rows = [];
  for (let m = 0; m < 12; m++) for (const s of stores) {
    const storeTotal = s.base * (1 + s.g * m / 11) * season[m];
    prodNames.forEach((p, i) => rows.push({ month: MONTHS[m], store: s.n, product: p, revenue: Math.round(storeTotal * shares[i] * (0.97 + rnd() * 0.06)) }));
  }
  const byStoreMonth = {}; const byMonth = Array(12).fill(0); const byProd = {};
  rows.forEach(r => { const mi = MONTHS.indexOf(r.month); byStoreMonth[r.store] = byStoreMonth[r.store] || Array(12).fill(0); byStoreMonth[r.store][mi] += r.revenue; byMonth[mi] += r.revenue; byProd[r.product] = (byProd[r.product] || 0) + r.revenue; });
  let topStore = null, topPct = -Infinity;
  for (const [s, arr] of Object.entries(byStoreMonth)) { const pct = (arr[11] - arr[0]) / arr[0] * 100; if (pct > topPct) { topPct = pct; topStore = s; } }
  const lowMonth = MONTHS[byMonth.indexOf(Math.min(...byMonth))];
  const topProduct = Object.entries(byProd).sort((a, b) => b[1] - a[1])[0][0];
  const csv = ['month,store,product,revenue', ...rows.map(r => `${r.month},${r.store},${r.product},${r.revenue}`)].join('\n');
  return { rows, csv, answers: { topStore, topPct: Math.round(topPct * 10) / 10, lowMonth, topProduct } };
}
function gradeDataset(data, a) {
  const norm = (x) => (x || '').toString().trim().toLowerCase();
  const pct = parseFloat(String(a.q1Pct || '').replace(/[^0-9.\-]/g, ''));
  const monthOk = (() => { const v = norm(a.q2Month); if (!v) return false; const target = data.answers.lowMonth.toLowerCase(); const idx = MONTHS.findIndex(m => m.toLowerCase() === target) + 1; return v === target || v === target.slice(0, 3) || v === String(idx); })();
  return [
    { label: 'Fastest-growing store', met: norm(a.q1Store) === data.answers.topStore.toLowerCase(), note: 'Compares December with January for each store.', auto: true },
    { label: 'Growth percentage (±3 points)', met: !isNaN(pct) && Math.abs(pct - data.answers.topPct) <= 3, note: '(December − January) ÷ January × 100.', auto: true },
    { label: 'Lowest revenue month', met: monthOk, note: 'Sum all stores and products per month.', auto: true },
    { label: 'Top product by revenue', met: norm(a.q3Product) === data.answers.topProduct.toLowerCase(), note: 'Sum revenue per product across the year.', auto: true }
  ];
}

/* Readiness verdict across four pillars: skills, money, work fit, remote fit. */
function readiness(state) {
  const p = state.profile; if (!p) return null;
  const career = CAREERS[p.careerKey];
  const m = computeMatch(profileSkills(p), career.req);
  const passed = [1, 2, 3, 4].filter(w => state.submissions[w]?.passed).length;
  const skills = clamp(m.score + passed * 6, 0, 100);
  const income = INCOMES.find(i => i.k === p.income)?.mid || 40000;
  const ratio = career.entry[0] / income;
  const money = ratio >= 0.95 ? 90 : ratio >= 0.8 ? 65 : 40;
  const cis = Object.values(state.checkins || {});
  const avg = (key) => cis.length ? cis.reduce((s, c) => s + c[key], 0) / cis.length : null;
  const energy = avg('energy'), remote = avg('remote');
  const pillars = [
    { key: 'skills', label: 'Skills', icon: 'target', value: skills, note: `${m.score}% starting match + ${passed} portfolio task${passed === 1 ? '' : 's'} passed` },
    { key: 'money', label: 'Money', icon: 'wallet', value: money, note: ratio >= 0.95 ? 'Entry pay roughly matches or beats your current income' : ratio >= 0.8 ? 'Expect a modest dip at entry level; plan a cushion' : 'Entry pay is well below your current income; transition gradually' },
    { key: 'fit', label: 'Work fit', icon: 'heart', value: energy == null ? null : Math.round(energy / 5 * 100), note: energy == null ? 'Rate your energy after each task' : `Average energy after tasks: ${energy.toFixed(1)} / 5` },
    { key: 'remote', label: 'Remote fit', icon: 'wifi', value: remote == null ? null : Math.round(remote / 5 * 100), note: remote == null ? 'Rate how working solo felt after each task' : `Comfort working solo: ${remote.toFixed(1)} / 5` }
  ];
  const known = pillars.filter(x => x.value != null);
  let verdict = null;
  if (passed >= 2 && known.length === 4) {
    const min = Math.min(...known.map(x => x.value)); const avgV = known.reduce((s, x) => s + x.value, 0) / 4;
    verdict = min >= 60 && avgV >= 70 ? 'ready' : min >= 45 ? 'close' : 'not_yet';
  }
  return { pillars, verdict, passed };
}

function parseJSONLoose(text) {
  try { return JSON.parse(text); } catch (e) { }
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) { try { return JSON.parse(fence[1]); } catch (e) { } }
  const i = text.indexOf('{'), j = text.lastIndexOf('}'); if (i >= 0 && j > i) { try { return JSON.parse(text.slice(i, j + 1)); } catch (e) { } }
  return null;
}
const memo = new Map();
async function aiJSON(prompt, opts = {}) {
  if (aiDisabled) return null; const p = await getProvider(); if (!p) return null;
  try {
    if (p.kind === 'gemini') return parseJSONLoose(await callServer({ prompt, json: true }, opts.signal));
    return await p.sample.json(prompt, { signal: opts.signal });
  } catch (e) { if (PERMANENT.includes(e?.code)) disableAI(); return null; }
}
async function aiText(input, opts = {}) {
  if (aiDisabled) return null; const p = await getProvider(); if (!p) return null;
  const key = opts.cache && opts.cache !== false ? JSON.stringify(input) : null;
  if (key && memo.has(key)) return memo.get(key);
  try {
    let text;
    if (p.kind === 'gemini') {
      const body = typeof input === 'string' ? { prompt: input } : { messages: input };
      text = await callServer(body, opts.signal);
      opts.onText && opts.onText({ text, delta: text });
    } else {
      const { cache, ...rest } = opts;
      text = (await p.sample(input, Object.assign({}, rest, typeof input === 'string' ? {} : { cache: false }))).text;
    }
    if (key) memo.set(key, text);
    return text;
  } catch (e) {
    if (PERMANENT.includes(e?.code)) disableAI();
    if (e?.name === 'AbortError' || e?.code === 'cancelled') return e.text || '';
    return null;
  }
}
const wait = (ms) => new Promise(r => setTimeout(r, ms));
function useAIStatus() {
  const [st, setSt] = useState({ kind: 'checking' });
  useEffect(() => { let alive = true; getProvider().then(p => { if (alive) setSt(p && !aiDisabled ? p : { kind: 'offline' }); }); const f = (v) => setSt(v); aiListeners.add(f); return () => { alive = false; aiListeners.delete(f); }; }, []);
  return st;
}

function streakOf(days) {
  const set = new Set(days); let n = 0; const d = new Date();
  for (;;) { const k = d.toISOString().slice(0, 10); if (set.has(k)) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}

function Gauge({ value }) {
  const r = 80, c = Math.PI * r, off = c * (1 - value / 100);
  return html`<svg viewBox="0 0 200 116" className="w-full max-w-[260px]" role="img" aria-label=${value + ' percent transferable skill match'}>
    <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--surface2)" stroke-width="16" stroke-linecap="round" />
    <path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="var(--accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray=${c} stroke-dashoffset=${off} style=${{ transition: 'stroke-dashoffset .8s ease' }} />
    <text x="100" y="92" text-anchor="middle" fill="var(--ink)" style=${{ font: '800 40px var(--font-display)' }}>${value}%</text>
    <text x="20" y="114" text-anchor="middle" fill="var(--muted)" style=${{ font: '500 10px var(--font-body)' }}>0</text>
    <text x="180" y="114" text-anchor="middle" fill="var(--muted)" style=${{ font: '500 10px var(--font-body)' }}>100</text>
  </svg>`;
}

function useInsight(profile, match) {
  const [text, setText] = useState(null);
  useEffect(() => {
    let alive = true; const c = CAREERS[profile.careerKey];
    const fallback = `Your work as ${/^[aeiou]/i.test(profile.jobLabel) ? 'an' : 'a'} ${profile.jobLabel.toLowerCase()} already covers ${match.score}% of what a ${c.title.toLowerCase()} needs, led by ${match.transferable.slice(0, 2).map(t => SKILLS[t.k].toLowerCase()).join(' and ') || 'your general work experience'}. ${match.gaps.length ? `The biggest gap is ${SKILLS[match.gaps[0].k].toLowerCase()}, which is exactly what the 4-week plan targets first.` : 'You have no major gaps, so the plan focuses on proof: portfolio pieces employers can see.'}`;
    (async () => {
      const prompt = `You are a practical US career coach. In 2-3 plain sentences (max 70 words, no lists, no hype), explain to a ${profile.jobLabel} why their experience transfers to a remote ${c.title} role and the one thing to focus on first. Facts computed by our system: transferable skill match ${match.score}%; strongest transferable skills: ${match.transferable.slice(0, 4).map(t => SKILLS[t.k]).join(', ') || 'none'}; biggest gaps: ${match.gaps.slice(0, 3).map(t => SKILLS[t.k]).join(', ') || 'none'}. Do not invent numbers.`;
      const t = await aiText(prompt, { modelTier: 'quick', cache: true });
      if (!alive) return;
      if (t) setText(t.trim()); else { await wait(700); if (alive) setText(fallback); }
    })();
    return () => { alive = false; };
  }, [profile.careerKey, profile.jobLabel]);
  return text;
}

      <h4 className="font-semibold">Your submission</h4>
      ${data && html`<div className="grid sm:grid-cols-2 gap-3 mt-3">
        <div><label htmlFor=${'q1s' + w} className="text-sm font-medium">1. Fastest-growing store</label><select id=${'q1s' + w} className="input mt-1" value=${ans.q1Store} onChange=${e => setAns(Object.assign({}, ans, { q1Store: e.target.value }))}><option value="">Choose a store</option>${['Downtown', 'Airport', 'Campus', 'Riverside', 'Harbor'].map(s => html`<option key=${s}>${s}</option>`)}</select></div>
        <div><label htmlFor=${'q1p' + w} className="text-sm font-medium">Its growth, Dec vs Jan (%)</label><input id=${'q1p' + w} className="input mt-1 tnum" inputMode="decimal" placeholder="e.g. 41.2" value=${ans.q1Pct} onChange=${e => setAns(Object.assign({}, ans, { q1Pct: e.target.value }))} /></div>
        <div><label htmlFor=${'q2' + w} className="text-sm font-medium">2. Lowest revenue month</label><select id=${'q2' + w} className="input mt-1" value=${ans.q2Month} onChange=${e => setAns(Object.assign({}, ans, { q2Month: e.target.value }))}><option value="">Choose a month</option>${MONTHS.map(m => html`<option key=${m}>${m}</option>`)}</select></div>
        <div><label htmlFor=${'q3' + w} className="text-sm font-medium">3. Top product by revenue</label><select id=${'q3' + w} className="input mt-1" value=${ans.q3Product} onChange=${e => setAns(Object.assign({}, ans, { q3Product: e.target.value }))}><option value="">Choose a product</option>${['Latte', 'Cold Brew', 'Pastries'].map(s => html`<option key=${s}>${s}</option>`)}</select></div>
      </div>`}
      <label htmlFor=${'link' + w} className="block text-sm font-medium mt-4">Link (optional): Google Doc, Figma, GitHub, Notion</label>
      <input id=${'link' + w} className="input mt-1" placeholder="https://" value=${link} onChange=${e => setLink(e.target.value)} />
      <label htmlFor=${'text' + w} className="block text-sm font-medium mt-4">${data ? 'Your recommendation to the director' : 'Write or paste your work'}</label>
      <textarea id=${'text' + w} className="input mt-1" placeholder=${data ? 'Based on the data, I recommend…' : 'Paste your answer here. Aim for clear, specific work you would show an employer.'} value=${text} onChange=${e => setText(e.target.value)}></textarea>
      <div className="flex flex-wrap items-center justify-between gap-3 mt-3">
        <span className=${`text-sm tnum ${words >= task.minWords ? 'text-ok' : 'text-muted'}`}>${words} / ${task.minWords}+ words</span>
        <div className="flex gap-2">${busy && html`<button className="btn btn-ghost" onClick=${stop}>Stop</button>`}
          <button className="btn btn-primary" disabled=${busy || (!text.trim() && !link.trim())} onClick=${submit}>${busy ? html`<${Icon} name="loader" size=${16} className="spin" /> Reviewing…` : html`<${Icon} name="sparkles" size=${16} /> Submit for AI Review`}</button></div>
      </div>
    </div>

    ${sub && sub.review && html`<${ReviewCard} sub=${sub} />`}
    ${sub && html`<${CheckIn} value=${checkin} onSave=${saveCheckin} />`}
  </div>`;
}

function ReviewCard({ sub }) {
  const ok = sub.lastPassed ?? sub.passed;
  return html`<div className="card p-6 fade-in" style=${{ borderColor: ok ? 'var(--ok)' : 'var(--warn)' }}>
    <div className="flex flex-wrap items-center justify-between gap-3">
      <div className="flex items-center gap-3"><div className=${`font-display text-4xl font-extrabold tnum ${ok ? 'text-ok' : 'text-warn'}`}>${sub.score}</div>
        <div><div className="font-semibold">${ok ? 'Portfolio Ready' : 'Revise and resubmit'}</div><div className="text-xs text-muted">${sub.ai ? 'Automatic checks + AI reviewer' : 'Automatic checks + offline reviewer'} · pass mark ${PASS}</div></div></div>
      ${ok && html`<span className="chip chip-ok"><${Icon} name="folder" size=${14} /> Added to My Portfolio</span>`}
    </div>
    <p className="mt-4">${sub.review.summary}</p>
    <div className="mt-4 grid md:grid-cols-2 gap-4">
      <div><div className="text-sm font-semibold text-ok mb-1.5">What works</div><ul className="grid gap-1 text-sm">${sub.review.strengths.map(x => html`<li key=${x} className="flex gap-2"><${Icon} name="check" size=${15} className="text-ok mt-0.5 shrink-0" />${x}</li>`)}</ul></div>
      <div><div className="text-sm font-semibold text-warn mb-1.5">Improve next</div><ul className="grid gap-1 text-sm">${sub.review.improvements.map(x => html`<li key=${x} className="flex gap-2"><span className="text-warn">→</span>${x}</li>`)}</ul></div>
    </div>
    <details className="mt-4"><summary className="text-sm font-semibold cursor-pointer">Automatic checks (${sub.checks.filter(c => c.met).length}/${sub.checks.length} passed)</summary>
      <ul className="mt-2 grid gap-1 text-sm">${sub.checks.map(c => html`<li key=${c.label} className="flex items-start gap-2"><span className=${c.met ? 'text-ok' : 'text-bad'}><${Icon} name=${c.met ? 'check' : 'x'} size=${15} /></span><span>${c.label}${c.note ? html` <span className="text-muted">· ${c.note}</span>` : ''}</span></li>`)}</ul></details>
  </div>`;
}

function CheckIn({ value, onSave }) {
  const [v, setV] = useState(value || { energy: 0, remote: 0 });
  const row = (key, label, low, high) => html`<div><div className="text-sm font-medium">${label}</div>
    <div className="flex gap-1.5 mt-2" role="radiogroup" aria-label=${label}>${[1, 2, 3, 4, 5].map(i => html`<button key=${i} role="radio" aria-checked=${v[key] === i} onClick=${() => { const nv = Object.assign({}, v, { [key]: i }); setV(nv); if (nv.energy && nv.remote) onSave(nv); }}
      className=${`w-10 h-10 rounded-lg border font-semibold tnum ${v[key] === i ? 'bg-accent text-accentInk border-transparent' : 'border-line hover:bg-surface2'}`}>${i}</button>`)}</div>
    <div className="flex justify-between text-xs text-muted mt-1 w-[226px] max-w-full"><span>${low}</span><span>${high}</span></div></div>`;
  return html`<div className="card p-6">
    <h4 className="font-semibold flex items-center gap-2"><${Icon} name="heart" size=${17} /> Quick check-in</h4>
    <p className="text-sm text-muted mt-1">Feeds your readiness verdict. Be honest; "not for me" is a useful answer too.</p>
    <div className="mt-4 grid sm:grid-cols-2 gap-5">${row('energy', 'How did doing this work feel?', 'Drained', 'Energized')}${row('remote', 'How was working on it alone, from home?', 'Lonely / hard', 'Loved it')}</div>
    ${value && html`<p className="text-sm text-ok mt-3 flex items-center gap-1.5"><${Icon} name="check" size=${15} /> Saved</p>`}
  </div>`;
}

function Portfolio({ state, update }) {
  const c = CAREERS[state.profile.careerKey];
  const items = [1, 2, 3, 4].map(w => ({ w, sub: state.submissions[w], mod: c.modules[w - 1] })).filter(x => x.sub?.passed);
  const allBullets = items.flatMap(x => x.sub.bullets || x.mod.task.bullets);
  const [copied, setCopied] = useState(false);
  const copyAll = async () => { try { await navigator.clipboard.writeText(allBullets.map(b => '• ' + b).join('\n')); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch (e) { } };
  if (!items.length) return html`<div className="card p-8 text-center"><span className="w-12 h-12 rounded-xl bg-accentSoft text-accent inline-flex items-center justify-center"><${Icon} name="folder" size=${22} /></span>
    <h2 className="font-display text-xl font-bold mt-3">Your portfolio fills up as you pass tasks</h2><p className="text-muted mt-1 max-w-md mx-auto">Each passed weekly task lands here with 2–3 resume bullets you can paste into your resume and LinkedIn.</p>
    <button className="btn btn-primary mt-5" onClick=${() => update({ tab: 'plan' })}>Go to this week's task</button></div>`;
  return html`<div className="grid gap-4">
    <div className="flex flex-wrap items-center justify-between gap-3"><h2 className="font-display text-2xl font-bold">My Portfolio</h2>
      <button className="btn btn-ghost !py-1.5 text-sm" onClick=${copyAll}><${Icon} name="copy" size=${15} /> ${copied ? 'Copied' : 'Copy all resume bullets'}</button></div>
    ${items.map(({ w, sub, mod }) => html`<article key=${w} className="card p-6">
      <div className="flex flex-wrap items-center justify-between gap-2"><span className="font-mono text-sm text-accent">Week ${w} · ${mod.name}</span><span className="chip chip-ok text-xs tnum">Score ${sub.score}</span></div>
      <h3 className="font-display text-xl font-bold mt-1">${mod.task.title}</h3>
      ${sub.link && html`<a href=${sub.link} target="_blank" rel="noopener" className="text-sm text-accent inline-flex items-center gap-1 mt-1 break-all">${sub.link} <${Icon} name="external" size=${13} /></a>`}
      <div className="mt-4"><div className="eyebrow mb-2">Resume bullets (ATS-friendly)</div><ul className="grid gap-2">${(sub.bullets || mod.task.bullets).map(b => html`<li key=${b} className="text-sm flex gap-2"><span className="text-accent">•</span>${b}</li>`)}</ul></div>
    </article>`)}
  </div>`;
}

function Jobs({ state }) {
  const c = CAREERS[state.profile.careerKey]; const kw = c.title.replace(/\s*\/.*$/, '');
  const q = encodeURIComponent('entry level ' + kw);
  const boards = [
    ['LinkedIn', 'Remote + entry level filters applied', `https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(kw)}&f_WT=2&f_E=1%2C2`],
    ['Indeed', 'Remote, entry-level search', `https://www.indeed.com/jobs?q=${q}&l=Remote`],
    ['We Work Remotely', 'Remote-only job board', `https://weworkremotely.com/remote-jobs/search?term=${encodeURIComponent(kw)}`],
    ['Remote.co', 'Curated remote roles', 'https://remote.co/remote-jobs/'],
    ['FlexJobs', 'Vetted remote and flexible jobs (paid)', `https://www.flexjobs.com/search?search=${encodeURIComponent(kw)}`],
    ['Wellfound', 'Startups that hire career changers', `https://wellfound.com/role/r/${encodeURIComponent(kw.toLowerCase().replace(/[^a-z]+/g, '-'))}`]
  ];
  const titles = { data_analyst: ['Junior Data Analyst', 'Reporting Analyst', 'Operations Analyst', 'Data Entry → Analyst apprenticeships'], instructional_designer: ['Instructional Design Associate', 'eLearning Developer', 'Training Coordinator', 'Curriculum Writer (contract)'], customer_success: ['Customer Success Associate', 'Onboarding Specialist', 'Customer Support Specialist (SaaS)', 'Implementation Coordinator'], ux_designer: ['Junior Product Designer', 'UX Design Intern / Apprentice', 'UI Designer (contract)', 'UX Researcher Assistant'], digital_marketer: ['Marketing Coordinator', 'Email Marketing Specialist', 'Social Media Coordinator', 'Content Marketing Assistant'], frontend_dev: ['Junior Frontend Developer', 'Web Developer (Entry Level)', 'WordPress Developer', 'Developer Apprenticeship'], technical_writer: ['Associate Technical Writer', 'Documentation Specialist', 'Knowledge Base Writer', 'Content Writer (Tech)'], virtual_assistant: ['Virtual Assistant', 'Remote Executive Assistant', 'Administrative Coordinator', 'Operations Assistant'], automation_specialist: ['Automation Specialist', 'Operations Specialist', 'No-Code Developer (contract)', 'RevOps Coordinator'], qa_tester: ['QA Tester', 'Manual QA Analyst', 'Software Test Associate', 'Beta / UAT Tester'], seo_specialist: ['SEO Coordinator', 'SEO Content Writer', 'Digital Marketing Assistant', 'Local SEO Specialist'] }[state.profile.careerKey] || [];
  return html`<div className="grid gap-5">
    <div><h2 className="font-display text-2xl font-bold">Entry-level remote jobs</h2><p className="text-muted mt-1">Pre-filtered searches for roles that accept career changers. Listings open on each job board.</p></div>
    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${boards.map(([n, d, u]) => html`<a key=${n} href=${u} target="_blank" rel="noopener" className="card p-5 hover:border-accent transition group">
      <div className="flex items-center justify-between gap-2"><span className="font-display font-bold text-lg group-hover:text-accent">${n}</span><${Icon} name="external" size=${16} className="text-muted" /></div><p className="text-sm text-muted mt-1">${d}</p><p className="text-xs mt-3 font-mono text-accent truncate">"${kw}" · remote</p></a>`)}</div>
    <div className="card p-6"><h3 className="font-semibold">Job titles that welcome career changers</h3><p className="text-sm text-muted mt-1">Search these too. They often skip the degree requirement when you show a portfolio.</p>
      <div className="flex flex-wrap gap-2 mt-3">${titles.map(t => html`<a key=${t} className="chip chip-accent hover:underline" target="_blank" rel="noopener" href=${`https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent(t.replace(/\s*\(.*\)/, ''))}&f_WT=2`}>${t}</a>`)}</div></div>
    <div className="card p-6"><h3 className="font-semibold">Before you apply</h3><ul className="mt-2 grid gap-1.5 text-sm">${['Lead your resume with your Pivot portfolio projects, then your current job', 'Paste your resume bullets from My Portfolio', 'Mention transferable skills from your match in the first line of your cover letter', 'Avoid listings that ask you to pay for training or equipment'].map(x => html`<li key=${x} className="flex gap-2"><${Icon} name="check" size=${16} className="text-ok mt-0.5 shrink-0" />${x}</li>`)}</ul></div>
  </div>`;
}

function Readiness({ state, update }) {
  const r = readiness(state); const c = CAREERS[state.profile.careerKey];
  const V = { ready: ['Ready to start applying', 'chip-ok', `Your skills, money picture, energy and remote comfort all point the same way. Keep building portfolio pieces while you apply for entry-level ${c.title} roles.`],
    close: ['Getting close', 'chip-warn', 'One pillar is holding you back. Look at the lowest score below and spend next week there before applying.'],
    not_yet: ['Not yet, and that is useful to know', 'chip-bad', `At least one pillar is weak. You learned this without quitting your job. Try another remote career or rework the weakest area.`] };
  return html`<div className="grid gap-5">
    <div><h2 className="font-display text-2xl font-bold">Readiness verdict</h2><p className="text-muted mt-1">Four pillars decide whether this pivot is right for you. The verdict unlocks after 2 passed tasks and check-ins.</p></div>
    <div className="card p-6">
      ${r.verdict ? html`<div><span className=${'chip ' + V[r.verdict][1]}><${Icon} name="shield" size=${14} /> Verdict</span><h3 className="font-display text-3xl font-bold mt-2">${V[r.verdict][0]}</h3><p className="mt-2 max-w-2xl">${V[r.verdict][2]}</p></div>`
        : html`<div className="flex items-start gap-3"><span className="w-10 h-10 rounded-lg bg-surface2 text-muted inline-flex items-center justify-center shrink-0"><${Icon} name="lock" /></span><div><h3 className="font-display text-xl font-bold">Verdict locked</h3><p className="text-sm text-muted mt-1">${r.passed}/2 tasks passed${Object.keys(state.checkins).length ? '' : ', no check-ins yet'}. Finish week ${Math.min(4, r.passed + 1)} and rate how it felt.</p></div></div>`}
    </div>
    <div className="grid sm:grid-cols-2 gap-4">${r.pillars.map(p => html`<div key=${p.key} className="card p-5">
      <div className="flex items-center justify-between"><span className="font-semibold flex items-center gap-2"><${Icon} name=${p.icon} size=${17} /> ${p.label}</span><span className=${`font-display text-2xl font-bold tnum ${p.value == null ? 'text-muted' : p.value >= 70 ? 'text-ok' : p.value >= 50 ? 'text-warn' : 'text-bad'}`}>${p.value == null ? '—' : p.value}</span></div>
      <div className="bar-track h-2 mt-3"><div className="h-full rounded-full transition-all" style=${{ width: (p.value || 0) + '%', background: p.value == null ? 'transparent' : p.value >= 70 ? 'var(--ok)' : p.value >= 50 ? 'var(--warn)' : 'var(--bad)' }}></div></div>
      <p className="text-sm text-muted mt-2">${p.note}</p></div>`)}</div>
    <div className="flex flex-wrap gap-3"><button className="btn btn-ghost" onClick=${() => update({ tab: 'plan' })}><${Icon} name="layers" size=${16} /> Back to plan</button></div>
  </div>`;
}

/* ------------------------------- Mentor ------------------------------- */
function mentorFallback(msg, state) {
  const c = CAREERS[state.profile.careerKey]; const w = state.activeWeek; const mod = c.modules[w - 1]; const t = msg.toLowerCase();
  if (/(stuck|task|how do i|start|help)/.test(t)) return `For "${mod.task.title}", start small: list the ${mod.task.deliverables.length} deliverables as headings, then fill each with one concrete example. The reviewer looks for: ${mod.task.criteria.map(x => x[0].toLowerCase()).join(', ')}. Draft it fast, submit, then use the feedback to revise.`;
  if (/(salary|pay|money|earn)/.test(t)) return `Entry-level remote ${c.title} roles typically start around ${fmtK(c.entry[0])}–${fmtK(c.entry[1])}, rising to ${fmtK(c.mid[0])}–${fmtK(c.mid[1])} with 2–4 years of experience. Keep your current job until you have 2–3 portfolio pieces and interviews lined up.`;
  if (/(time|busy|kids|schedule|tired)/.test(t)) return `With a job and family, aim for 4 short sessions a week: two 45-minute weeknight sessions for the free lessons, one weekend hour for the task, and 15 minutes to submit and read feedback. Consistency beats marathons.`;
  if (/(job|apply|resume|interview)/.test(t)) return `Apply once you have 2 portfolio pieces. Lead your resume with them, paste the bullets from My Portfolio, and search the titles in the Remote Jobs tab. In interviews, connect one story from your current job to each skill the role needs.`;
  return `This week is about ${mod.name.toLowerCase()}. Focus on: ${mod.core.join('; ')}. Ask me about the task, your schedule, pay, or how to apply, and I'll get specific.`;
}

function Mentor({ state, update }) {
  const [open, setOpen] = useState(false);
  const [input, setInput] = useState('');
  const [busy, setBusy] = useState(false);
  const [live, setLive] = useState('');
  const endRef = useRef(null); const ctlRef = useRef(null);
  const chat = state.chat || [];
  useEffect(() => { endRef.current?.scrollIntoView({ block: 'end' }); }, [chat.length, live, open]);
  if (!state.profile || state.view !== 'workspace') return null;
  const c = CAREERS[state.profile.careerKey]; const mod = c.modules[state.activeWeek - 1];
  const send = async (text) => {
    const msg = (text || input).trim(); if (!msg || busy) return;
    setInput(''); setBusy(true); setLive('');
    const turns = [...chat, { role: 'user', content: msg }].slice(-12);
    update(s => ({ chat: [...(s.chat || []), { role: 'user', content: msg }].slice(-30) }));
    const rules = `You are Pivot's AI career and study mentor for US adults (25-45) switching to remote work while keeping their job. Be warm, concrete and brief (under 120 words unless asked for more). Use plain American English. Never promise jobs or salaries. Context: current job: ${state.profile.jobLabel}; target: remote ${c.title}; week ${state.activeWeek} of 4, module "${mod.name}" (${mod.core.join(', ')}); this week's task: "${mod.task.title}" — ${mod.task.scenario}. Typical entry pay: ${fmtK(c.entry[0])}-${fmtK(c.entry[1])}. Help them learn; do not write the whole task for them.`;
    const ctl = new AbortController(); ctlRef.current = ctl;
    let answer = await aiText([{ role: 'user', content: rules }, ...turns], { modelTier: 'quick', cache: false, signal: ctl.signal, onText: ({ text }) => setLive(text) });
    if (answer == null) { await wait(900); answer = mentorFallback(msg, state); }
    setLive('');
    update(s => ({ chat: [...(s.chat || []), { role: 'assistant', content: answer || '(stopped)' }].slice(-30) }));
    setBusy(false);
  };
  return html`<div>
    ${open && html`<section className="mentor-panel card shadow-2xl flex flex-col fade-in" aria-label="AI mentor">
      <div className="flex items-center justify-between gap-2 px-4 py-3 border-b border-line"><div><div className="font-semibold flex items-center gap-2"><${Icon} name="sparkles" size=${16} /> AI Mentor</div><div className="text-xs text-muted">Knows your plan: week ${state.activeWeek}, ${c.title}</div></div>
        <button className="btn btn-ghost !p-1.5" onClick=${() => setOpen(false)} aria-label="Close mentor"><${Icon} name="x" size=${16} /></button></div>
      <div className="flex-1 overflow-y-auto px-4 py-3 grid gap-3 content-start text-sm" style=${{ minHeight: 220 }}>
        ${chat.length === 0 && html`<div className="text-muted">Ask anything about this week, your task, your schedule or how to apply.
          <div className="flex flex-wrap gap-1.5 mt-3">${['I\'m stuck on this week\'s task', 'How do I fit this around my job?', 'When should I start applying?'].map(s => html`<button key=${s} className="chip chip-accent text-left" onClick=${() => send(s)}>${s}</button>`)}</div></div>`}
        ${chat.map((m, i) => html`<div key=${i} className=${m.role === 'user' ? 'justify-self-end max-w-[85%] bg-accent text-accentInk rounded-2xl rounded-br-md px-3 py-2' : 'max-w-[92%] bg-surface2 rounded-2xl rounded-bl-md px-3 py-2 whitespace-pre-wrap'}>${m.content}</div>`)}
        ${busy && html`<div className="max-w-[92%] bg-surface2 rounded-2xl rounded-bl-md px-3 py-2 whitespace-pre-wrap">${live || html`<span className="inline-flex gap-1.5"><span className="dot"></span><span className="dot"></span><span className="dot"></span></span>`}</div>`}
        <div ref=${endRef}></div>
      </div>
      <form className="flex gap-2 p-3 border-t border-line" onSubmit=${e => { e.preventDefault(); send(); }}>
        <label htmlFor="mentor-input" className="sr-only">Message</label>
        <input id="mentor-input" className="input" placeholder="Ask your mentor…" value=${input} onChange=${e => setInput(e.target.value)} />
        ${busy ? html`<button type="button" className="btn btn-ghost !px-3" onClick=${() => ctlRef.current?.abort()}>Stop</button>` : html`<button className="btn btn-primary !px-3" aria-label="Send" disabled=${!input.trim()}><${Icon} name="send" size=${16} /></button>`}
      </form>
    </section>`}
    <button className="mentor-fab btn btn-primary shadow-xl !rounded-full !px-4 !py-3" onClick=${() => setOpen(!open)} aria-expanded=${open}><${Icon} name=${open ? 'x' : 'message'} size=${18} /> ${open ? 'Close' : 'Ask mentor'}</button>
  </div>`;
}

/* ------------------------------- App ------------------------------- */
function App() {
  const [state, setState] = useState(loadState);
  const [wizard, setWizard] = useState(false);
  const [learn, setLearn] = useState(null);
  useEffect(() => { saveState(state); }, [state]);
  useEffect(() => { window.scrollTo(0, 0); }, [state.view]);
  const update = (patch, clearProfile) => setState(s => {
    const p = typeof patch === 'function' ? patch(s) : patch;
    return Object.assign({}, s, p, clearProfile ? { profile: null, submissions: {}, checkins: {}, chat: [], startedAt: null } : {});
  });
  const go = (view) => update({ view });
  const reset = () => { setState(EMPTY); };
  const onDone = (profile) => { setWizard(false); setState(Object.assign({}, EMPTY, { profile, view: 'compat', activeDays: [todayStr()] })); };
  let view = state.view;
  if (!state.profile && view !== 'landing') view = 'landing';
  return html`<div>
    <${Header} state=${state} go=${go} reset=${reset} />
    ${view === 'landing' && html`<${Landing} onStart=${() => setWizard(true)} onDemo=${() => setState(demoState())} />`}
    ${view === 'compat' && html`<${Compatibility} state=${state} update=${update} go=${go} changeCareer=${() => setWizard({ step: 3, job: state.profile.jobLabel, income: state.profile.income })} />`}
    ${view === 'skillset' && html`<${Skillset} state=${state} update=${update} go=${go} />`}
    ${view === 'workspace' && html`<${Workspace} state=${state} update=${update} openLearn=${setLearn} />`}
    ${view !== 'landing' && html`<${Footer} />`}
    ${wizard && html`<${Wizard} init=${typeof wizard === 'object' ? wizard : null} onClose=${() => setWizard(false)} onDone=${onDone} />`}
    ${learn && html`<${CareerDrawer} k=${learn} onClose=${() => setLearn(null)} />`}
    <${Mentor} state=${state} update=${update} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
